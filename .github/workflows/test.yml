name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dismech-owl
      - name: Read pinned dismech commit
        id: ref
        run: echo "sha=$(cat dismech-owl/DISMECH_REF)" >> "$GITHUB_OUTPUT"
      # Sibling checkout, so the ../dismech path source in pyproject.toml resolves.
      # Only src/ and kb/ are needed; references_cache/ and pages/ are skipped.
      - uses: actions/checkout@v4
        with:
          repository: monarch-initiative/dismech
          ref: ${{ steps.ref.outputs.sha }}
          path: dismech
          sparse-checkout: |
            src
            kb
      - uses: astral-sh/setup-uv@v6
      - name: Test
        working-directory: dismech-owl
        env:
          DISMECH_DIR: ../dismech
        run: |
          uv sync
          uv run ruff check src tests
          uv run pytest -q
